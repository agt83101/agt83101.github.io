<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="mobile-web-app-capable" content="yes">
<title>Monk — Prototype 0.1</title>
<style>
/* VOICE: a quiet, cinematic test bench, the game owns the screen
   IDEA: an old pencil study on stained parchment, brought to life
   PICTURE: the playable scene, letterboxed 16:9, nothing in front of it
   COLOUR and TYPE: sepia ink on parchment; Georgia for the bench labels
   LAYOUT: full-bleed stage, a small collapsible dev panel bottom-right */
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#120d08;overflow:hidden;color:#e9dcc0;font:14px/1.4 Georgia,"Times New Roman",serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* #app is the landscape frame. In portrait on touch devices it is turned 90° so the game always plays sideways. */
#app{position:fixed;inset:0;overflow:hidden}
body.rot #app{inset:auto;top:0;left:0;width:var(--h);height:var(--w);transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
#stage{position:absolute;inset:0;display:grid;place-items:center}
#c{display:block;background:#d6c4a0;touch-action:none;outline:none}
#c.graphite{filter:grayscale(1) contrast(1.06)}
#hud{position:absolute;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.6)}
#hud b{letter-spacing:.06em;font-size:15px}
#hud span{opacity:.75;font-style:italic;margin-left:8px}
#hud .keys{opacity:.7;font-size:13px;margin-top:2px}
#panel{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:250px;max-height:calc(100% - 24px);overflow-y:auto;background:rgba(24,17,10,.86);border:1px solid rgba(233,220,192,.18);border-radius:6px;padding:4px 12px 12px;backdrop-filter:blur(3px);transition:width .2s}
#benchToggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:0;padding:6px 0;background:none;border:0;border-radius:0;font-style:italic;font-size:13px;opacity:.9;min-height:34px}
#benchToggle svg{width:14px;height:14px;transition:transform .2s}
#panel.collapsed{width:auto;padding:2px 12px}
#panel.collapsed #benchBody{display:none}
#panel.collapsed #benchToggle svg{transform:rotate(180deg)}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>span{width:52px;opacity:.75;font-size:13px}
button{font:inherit;font-size:13px;color:#e9dcc0;background:rgba(233,220,192,.06);border:1px solid rgba(233,220,192,.25);border-radius:4px;padding:4px 9px;cursor:pointer;min-height:30px}
button.on{background:#e9dcc0;color:#20160d}
button:focus-visible,input:focus-visible{outline:2px solid #f3e2b8;outline-offset:2px}
label{display:flex;gap:8px;align-items:center;font-size:13px;margin:5px 0;cursor:pointer}
input[type=checkbox]{accent-color:#c9ad7a;width:15px;height:15px}
#stats{font-size:12px;opacity:.6;margin-top:8px;font-variant-numeric:tabular-nums;white-space:pre}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#120d08;font-style:italic;font-size:17px;letter-spacing:.03em;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#focus{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(24,17,10,.75);padding:6px 14px;border-radius:20px;font-size:13px;font-style:italic;pointer-events:none;transition:opacity .5s}
@media(max-width:700px),(max-height:500px){#panel{width:210px;font-size:12px}#hud .keys{display:none}label{margin:3px 0}.row{margin:4px 0}}
@media(pointer:coarse){#hud .keys{display:none}#benchToggle{min-height:44px}button{min-height:38px}input[type=checkbox]{width:20px;height:20px}#c{cursor:default}}
#fs{display:none}.can-fs #fs{display:inline-block}
</style>
</head>
<body>
<div id="app">
<div id="stage"><canvas id="c" tabindex="0"></canvas></div>
<div id="hud"><b>MONK</b><span>prototype 0.1: traversal, camera &amp; parallax</span>
  <div class="keys">← → or A D to walk · H collapses the dev bench</div></div>
<div id="panel">
  <button id="benchToggle" aria-expanded="true" aria-controls="benchBody" title="Collapse or expand (H)"><span>Dev bench</span><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="benchBody">
  <div class="row"><span>Camera</span><button data-cam="follow" class="on">Follow</button><button data-cam="flip">Flip-screen</button></div>
  <div class="row"><span>Tint</span><button data-tint="sepia" class="on">Sepia</button><button data-tint="graphite">Graphite</button></div>
  <label><input type="checkbox" id="seams"> Show parallax modules</label>
  <label><input type="checkbox" id="rig"> Show monk rig</label>
  <label><input type="checkbox" id="boil" checked> Line boil</label>
  <label><input type="checkbox" id="twos"> Animate on twos (12 fps)</label>
  <label><input type="checkbox" id="slow"> Slow motion ¼×</label>
  <div class="row"><button id="reseed">New world seed</button><button id="fs">Fullscreen</button></div>
  <div id="stats"></div>
  </div>
</div>
<div id="focus">Click the scene, then hold ← or →. On touch, hold the left or right side.</div>
<div id="loading">Sharpening pencils…</div>
</div>

<script>
{
// ================================================================ constants
let VW = 1920; const VH = 1080;      // logical view: height fixed (long shot), width follows the screen's aspect
const AR_MIN = 4/3, AR_MAX = 2.4;    // 4:3 up to ~21:9; beyond that, letterbox
const GROUND = 790;                  // walk line on the play layer
const WORLD_W = 11520;               // platform length: six screens
const CW = 960;                      // module (chunk) width in layer space
let SEED = 7;
const INK = '38,26,16';
const ink = a => `rgba(${INK},${a})`;
const PAPER = '214,197,161';
const paper = a => `rgba(${PAPER},${a})`;
const LIGHT = '238,227,200';
const light = a => `rgba(${LIGHT},${a})`;

// ================================================================ rng / noise
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(...n){let h=2166136261>>>0;for(const v of n){h^=(v|0);h=Math.imul(h,16777619);h^=h>>>15;h=Math.imul(h,2246822507);h^=h>>>13}return h>>>0}
const h01 = (i,s) => hash(i,s)/4294967296;
function noise1(x,seed){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);const a=h01(i,seed),b=h01(i+1,seed);return a+(b-a)*u}
function fbm(x,seed,oct=3){let s=0,a=.5,f=1,n=0;for(let i=0;i<oct;i++){s+=a*noise1(x*f,seed+i*131);n+=a;a*=.5;f*=2.03}return s/n}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0));return t*t*(3-2*t)};

// ================================================================ pencil toolkit
function smoothTo(p,pts,closed){
  const n=pts.length; if(n<2) return;
  if(!closed){p.moveTo(pts[0].x,pts[0].y);for(let i=1;i<n-1;i++){const m={x:(pts[i].x+pts[i+1].x)/2,y:(pts[i].y+pts[i+1].y)/2};p.quadraticCurveTo(pts[i].x,pts[i].y,m.x,m.y)}p.lineTo(pts[n-1].x,pts[n-1].y);return}
  const m0={x:(pts[n-1].x+pts[0].x)/2,y:(pts[n-1].y+pts[0].y)/2};p.moveTo(m0.x,m0.y);
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];p.quadraticCurveTo(a.x,a.y,(a.x+b.x)/2,(a.y+b.y)/2)}
  p.closePath();
}
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y}return{x0,y0,x1,y1}}

// World-anchored hatching: every stroke is a pure function of its grid cell,
// so any module that hatches the same region draws identical strokes (seamless).
function hatch(ctx,b,o){
  const ang=o.angle??-0.95,ca=Math.cos(ang),sa=Math.sin(ang);
  let nmin=1e9,nmax=-1e9,tmin=1e9,tmax=-1e9;
  for(const [x,y] of [[b.x0,b.y0],[b.x1,b.y0],[b.x0,b.y1],[b.x1,b.y1]]){const n=-sa*x+ca*y,t=ca*x+sa*y;nmin=Math.min(nmin,n);nmax=Math.max(nmax,n);tmin=Math.min(tmin,t);tmax=Math.max(tmax,t)}
  const sp=o.spacing||5,L=o.cell||38,seed=o.seed|0,NB=5,gaps=o.gaps??.18;
  const paths=[];for(let i=0;i<NB;i++)paths.push(new Path2D());
  const i0=Math.floor(nmin/sp)-1,i1=Math.ceil(nmax/sp)+1,j0=Math.floor(tmin/L)-1,j1=Math.ceil(tmax/L)+1;
  for(let i=i0;i<=i1;i++){
    const no=i*sp+(h01(i,seed)-.5)*sp*.6;
    for(let j=j0;j<=j1;j++){
      const r1=h01(i*7919+j,seed+1),r2=h01(i*104729+j*31,seed+2);
      if(h01(i+j*7717,seed+3)<gaps) continue;
      const ts=j*L+r1*L*.35,len=L*(.45+.55*r2)*(o.lenMul||1);
      const ax=ca*ts-sa*no,ay=sa*ts+ca*no,bx=ax+ca*len,by=ay+sa*len,mx=(ax+bx)/2,my=(ay+by)/2;
      let s=o.shade?o.shade(mx,my):1; if(s<=.04) continue;
      const k=Math.min(NB-1,Math.floor(Math.min(1,s)*NB));
      const bow=(r1-.5)*sp*.7;
      paths[k].moveTo(ax,ay);paths[k].quadraticCurveTo(mx-sa*bow,my+ca*bow,bx,by);
    }
  }
  ctx.lineCap='round';ctx.lineWidth=o.width||1.25;
  for(let k=0;k<NB;k++){ctx.strokeStyle=ink((o.alpha||.3)*(k+1)/NB);ctx.stroke(paths[k])}
}

// Hand contour: a heavier pass broken into runs of varying weight, then a ghost pass.
function contour(ctx,R,pts,closed,w=1.6,a=.75,jit=1.1){
  const n=pts.length; if(n<2) return;
  const q=pts.map(p=>({x:p.x+(R()-.5)*jit*2,y:p.y+(R()-.5)*jit*2}));
  ctx.lineCap='round';ctx.lineJoin='round';
  const run=5; const end=closed?n:n-1;
  for(let s=0;s<end;s+=run){
    const seg=[];for(let i=s;i<=Math.min(s+run,closed?n:n-1);i++)seg.push(q[i%n]);
    const p=new Path2D();smoothTo(p,seg,false);
    ctx.lineWidth=w*(.65+R()*.7);ctx.strokeStyle=ink(a*(.7+R()*.3));ctx.stroke(p);
  }
  const g=new Path2D();smoothTo(g,pts.map(p=>({x:p.x+(R()-.5)*jit*3,y:p.y+(R()-.5)*jit*3})),closed);
  ctx.lineWidth=w*.5;ctx.strokeStyle=ink(a*.4);ctx.stroke(g);
}
// Deterministic contour for continuous strips (jitter keyed to world x).
function contourDet(ctx,pts,seed,w=1.6,a=.7){
  const j=pts.map(p=>({x:p.x,y:p.y+(h01(Math.round(p.x),seed)-.5)*1.6}));
  const p=new Path2D();smoothTo(p,j,false);ctx.lineCap='round';ctx.lineWidth=w;ctx.strokeStyle=ink(a);ctx.stroke(p);
  const g=new Path2D();smoothTo(g,pts.map(p=>({x:p.x,y:p.y+(h01(Math.round(p.x),seed+9)-.5)*3})),false);ctx.lineWidth=w*.5;ctx.strokeStyle=ink(a*.45);ctx.stroke(g);
}

function drawForm(ctx,R,pts,o={}){
  const path=new Path2D();smoothTo(path,pts,true);
  const b=bbox(pts),cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2,sz=Math.max(40,Math.max(b.x1-b.x0,b.y1-b.y0));
  ctx.fillStyle=o.base||paper(1);ctx.fill(path);
  if(o.tone){ctx.fillStyle=ink(o.tone);ctx.fill(path)}
  ctx.save();ctx.clip(path);
  const bw=Math.max(30,b.x1-b.x0),bh=Math.max(30,b.y1-b.y0);const shade=o.shade||((x,y)=>.42+.75*(x-cx)/bw+.6*(y-cy)/bh);
  if(o.ha!==0) hatch(ctx,b,{angle:o.angle??-0.95,spacing:o.sp||4.2,alpha:(o.ha??.34)*1.5,shade,seed:o.seed|0,cell:o.cell});
  if(o.cross!==false) hatch(ctx,b,{angle:(o.angle??-0.95)+1.45,spacing:(o.sp||4.2)*1.2,alpha:(o.ha??.34)*1.3,shade:(x,y)=>(shade(x,y)-.5)*2,seed:(o.seed|0)+5,cell:o.cell});
  if(o.cross!==false) hatch(ctx,b,{angle:(o.angle??-0.95)+.5,spacing:(o.sp||4.2)*1.5,alpha:(o.ha??.34)*1.2,shade:(x,y)=>(shade(x,y)-.75)*3,seed:(o.seed|0)+9,cell:o.cell*.7||26});
  ctx.lineWidth=o.rimW||14;ctx.strokeStyle=ink(o.rimA??.12);ctx.stroke(path);
  ctx.lineWidth=4;ctx.strokeStyle=ink((o.rimA??.12)*1.1);ctx.stroke(path);
  if(o.inner) o.inner(ctx,R);
  ctx.restore();
  contour(ctx,R,pts,true,o.ow||1.6,o.oa??.75);
  return path;
}

// Lambert shading of a tube around its spine: hatching follows the volume.
function spineShade(sp,rf,bias=0){const n=sp.length,Lx=-.48,Ly=-.62,Lz=.62;
  return (x,y)=>{let bi=0,bd=1e18;for(let i=0;i<n;i+=1){const dx=x-sp[i].x,dy=y-sp[i].y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}
    const r=Math.max(2,rf(bi/(n-1),bi)),ox=(x-sp[bi].x)/r,oy=(y-sp[bi].y)/r,q=Math.min(1,ox*ox+oy*oy),oz=Math.sqrt(1-q);
    const br=Math.max(0,ox*Lx+oy*Ly+oz*Lz);return clamp(1.05-br*1.05+bias+.25*q,0,1.2)}}
function cells(ctx,R,cx,cy,rad,n,a=.6){
  for(let i=0;i<n;i++){const an=R()*6.28,d=Math.sqrt(R())*rad,x=cx+Math.cos(an)*d,y=cy+Math.sin(an)*d,r=1.8+R()*5.5;
    const pts=blob(R,x,y,r,r*(.7+R()*.5),8,.3);const p=new Path2D();smoothTo(p,pts,true);
    ctx.fillStyle=ink(a*.25);ctx.fill(p);ctx.lineWidth=.9;ctx.strokeStyle=ink(a);ctx.stroke(p);
    ctx.beginPath();ctx.arc(x+r*.15,y+r*.2,r*.35,0,6.3);ctx.fillStyle=ink(a*.9);ctx.fill();
    ctx.beginPath();ctx.arc(x,y,r*.95,.2*Math.PI,.8*Math.PI);ctx.lineWidth=1;ctx.strokeStyle=light(.45);ctx.stroke()}}
function spinePoly(sp,rf){
  const L=[],Rt=[],n=sp.length;
  for(let i=0;i<n;i++){
    const a=sp[Math.max(0,i-1)],b=sp[Math.min(n-1,i+1)];let tx=b.x-a.x,ty=b.y-a.y;const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    const r=rf(i/(n-1),i),p=sp[i];L.push({x:p.x-ty*r,y:p.y+tx*r});Rt.push({x:p.x+ty*r,y:p.y-tx*r});
  }
  return L.concat(Rt.reverse());
}
function spineFrame(sp,i){const n=sp.length,a=sp[Math.max(0,i-1)],b=sp[Math.min(n-1,i+1)];let tx=b.x-a.x,ty=b.y-a.y;const l=Math.hypot(tx,ty)||1;return{tx:tx/l,ty:ty/l,nx:-ty/l,ny:tx/l}}
function bez(p0,p1,p2,p3,n){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push({x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y})}return o}
function curlSpine(R,x,y,ang,len,curl,n=20){const pts=[{x,y}];let a=ang;const seg=len/n;for(let i=0;i<n;i++){const t=i/n;a+=curl*(.015+.32*t*t*t)+(R()-.5)*.12;x+=Math.cos(a)*seg;y+=Math.sin(a)*seg;pts.push({x,y})}return pts}

function blob(R,x,y,rx,ry,n=12,j=.2,rot=0){const o=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,r=1+(R()-.5)*j*2;const px=Math.cos(a)*rx*r,py=Math.sin(a)*ry*r;o.push({x:x+px*Math.cos(rot)-py*Math.sin(rot),y:y+px*Math.sin(rot)+py*Math.cos(rot)})}return o}

function pore(ctx,R,x,y,rx,ry,dark=.62){
  const pts=blob(R,x,y,rx,ry,11,.22,(R()-.5)*.8);const p=new Path2D();smoothTo(p,pts,true);
  ctx.fillStyle=ink(dark);ctx.fill(p);
  const q=new Path2D();smoothTo(q,blob(R,x,y-ry*.25,rx*.7,ry*.55,9,.2),true);ctx.fillStyle=ink(dark*.55);ctx.fill(q);
  ctx.beginPath();ctx.ellipse(x,y+ry*.15,rx*1.05,ry*.95,0,.15*Math.PI,.85*Math.PI);ctx.lineWidth=Math.max(1.2,rx*.22);ctx.strokeStyle=light(.5);ctx.stroke();
  contour(ctx,R,pts,true,1.1,.65,.5);
}
function cavity(ctx,R,x,y,rx,ry){
  const pts=blob(R,x,y,rx,ry,14,.15);const p=new Path2D();smoothTo(p,pts,true);
  ctx.fillStyle=ink(.8);ctx.fill(p);
  ctx.save();ctx.clip(p);
  const n=4+Math.floor(R()*4);
  for(let k=0;k<n;k++){const u=(k+.5)/n,xx=x-rx+u*rx*2,bend=(u-.5)*rx*.5;
    const len=ry*(.6+R()*1.1);ctx.beginPath();ctx.moveTo(xx,y-ry*1.1);ctx.quadraticCurveTo(xx+bend,y-ry*1.1+len*.6,xx-bend*.3,y-ry*1.1+len);
    ctx.lineWidth=rx*.08+1;ctx.strokeStyle=light(.3);ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle=ink(.75);ctx.stroke()}
  const g=ctx.createRadialGradient(x,y-ry*.3,0,x,y,ry*1.3);g.addColorStop(0,ink(.0));g.addColorStop(1,ink(.55));ctx.fillStyle=g;ctx.fill(p);
  ctx.restore();
  ctx.beginPath();ctx.ellipse(x,y+ry*.1,rx,ry,0,.1*Math.PI,.9*Math.PI);ctx.lineWidth=3;ctx.strokeStyle=light(.55);ctx.stroke();
  contour(ctx,R,pts,true,1.8,.85,.8);
}
function ribs(ctx,R,sp,rf,from,to,every=3){
  for(let i=Math.floor(from*(sp.length-1));i<=to*(sp.length-1);i+=every){
    const f=spineFrame(sp,i),r=rf(i/(sp.length-1),i)*.9,p=sp[i];
    const a={x:p.x+f.nx*r,y:p.y+f.ny*r},b={x:p.x-f.nx*r,y:p.y-f.ny*r},c={x:p.x+f.tx*r*.45,y:p.y+f.ty*r*.45};
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.lineWidth=1.3;ctx.strokeStyle=ink(.42);ctx.stroke();
    ctx.beginPath();ctx.moveTo(a.x-f.tx*2.5,a.y-f.ty*2.5);ctx.quadraticCurveTo(c.x-f.tx*2.5,c.y-f.ty*2.5,b.x-f.tx*2.5,b.y-f.ty*2.5);ctx.lineWidth=1.6;ctx.strokeStyle=light(.35);ctx.stroke();
  }
}
function eggs(ctx,R,x,y,s=1){
  const g=ctx.createRadialGradient(x,y,0,x,y,70*s);g.addColorStop(0,light(.35));g.addColorStop(1,light(0));ctx.fillStyle=g;ctx.fillRect(x-80*s,y-80*s,160*s,160*s);
  const back=new Path2D();smoothTo(back,blob(R,x,y,30*s,20*s,10,.25),true);ctx.fillStyle=ink(.6);ctx.fill(back);
  const n=6+Math.floor(R()*6);
  for(let i=0;i<n;i++){const a=R()*6.28,d=R();const ex=x+Math.cos(a)*d*24*s,ey=y+Math.sin(a)*d*14*s,rx=(4.5+R()*4)*s,ry=rx*(1.1+R()*.3);
    ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,(R()-.5)*.6,0,6.283);ctx.fillStyle=light(.92);ctx.fill();
    ctx.beginPath();ctx.ellipse(ex+rx*.25,ey+ry*.25,rx*.7,ry*.6,0,0,6.283);ctx.fillStyle=ink(.14);ctx.fill();
    ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,6.283);ctx.lineWidth=1.1;ctx.strokeStyle=ink(.7);ctx.stroke()}
}
function tendril(ctx,R,x,y,ang,len,r0,curl,tone=.55,hatchIt=false,seed=0){
  const sp=curlSpine(R,x,y,ang,len,curl,Math.max(8,Math.round(len/10)));
  const rf=t=>r0*Math.pow(1-t,.85)+.6;const poly=spinePoly(sp,rf);
  if(hatchIt&&r0>9){drawForm(ctx,R,poly,{sp:4.2,ha:.34,seed,oa:.7,ow:1.3,rimW:8,shade:spineShade(sp,rf),inner:(c)=>ribs(c,R,sp,rf,.05,.85,2)})}

  const vg=x.createRadialGradient(W/2,H*.48,H*.35,W/2,H/2,H*1.02);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(.7,'rgba(120,88,52,.18)');vg.addColorStop(1,'rgba(70,46,24,.62)');x.fillStyle=vg;x.fillRect(0,0,W,H);

  dust=[];for(let f=0;f<4;f++){const c=document.createElement('canvas');c.width=Math.round(W/2);c.height=Math.round(H/2);const y=c.getContext('2d');

    if(Math.random()<.7){y.beginPath();let px=Math.random()*c.width,py=Math.random()*c.height;y.moveTo(px,py);for(let s=0;s<5;s++){px+=(Math.random()-.5)*24;py+=(Math.random()-.5)*24;y.lineTo(px,py)}y.lineWidth=.8;y.strokeStyle='rgba(40,28,16,.35)';y.stroke()}
    if(Math.random()<.5){const sx=Math.random()*c.width;y.fillStyle='rgba(250,240,215,.25)';y.fillRect(sx,0,1,c.height)}

// ================================================================ monk rig
const RIG={thigh:63,shin:61,ankleH:9,S:188,beta:.62,stepH:12,maxSpeed:148,torso:78,upper:45,fore:41};
const A_REACH=RIG.S*RIG.beta/2;
function walkFoot(p){p=((p%1)+1)%1;const b=RIG.beta,a=A_REACH;
  if(p<b){const x=a-RIG.S*p;let ang=0,piv=0;
    if(p<.08){ang=.28*Math.pow(1-p/.08,2);piv=-1}
    const k=(p-(b-.17))/.17;if(k>0){ang=-.62*k*k;piv=1}
    return{x,lift:0,ang,piv}}
  const q=(p-b)/(1-b),e=.5-.5*Math.cos(Math.PI*q);
  return{x:-a+2*a*e,lift:RIG.stepH*Math.sin(Math.PI*Math.pow(q,.85)),ang:lerp(-.62,.28,sstep(0,1,q)),piv:0};
}
function rot(v,a){const c=Math.cos(a),s=Math.sin(a);return{x:v.x*c-v.y*s,y:v.x*s+v.y*c}}
function ankleOf(f){ // f: {lx (flat-foot ankle x, local), lift, ang, piv}
  if(f.piv>0&&f.ang<0){const toe={x:f.lx+21,y:0};const r=rot({x:-21,y:RIG.ankleH},f.ang);return{x:toe.x+r.x,y:r.y}}

function ik(h,a,l1,l2){let dx=a.x-h.x,dy=a.y-h.y,d=Math.hypot(dx,dy);const mx=l1+l2-.01;if(d>mx){a={x:h.x+dx/d*mx,y:h.y+dy/d*mx};dx=a.x-h.x;dy=a.y-h.y;d=mx}
  const base=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const k1={x:h.x+Math.cos(base+al)*l1,y:h.y+Math.sin(base+al)*l1},k2={x:h.x+Math.cos(base-al)*l1,y:h.y+Math.sin(base-al)*l1};
  return{knee:k1.x>k2.x?k1:k2,ankle:a}}

const M={x:1500,facing:1,speed:0,phase:0,state:'idle',stopReq:false,turnQ:0,
  feet:[{wx:1515,lift:0,ang:0,piv:0},{wx:1485,lift:0,ang:0,piv:0}],
  start:null,settle:null,turn:null,walkW:0,cloth:{x:0,v:0},hood:{x:0,v:0},t:0,look:0,lookT:4};
let input=0;

function beginWalk(){
  const f=M.facing,rel=M.feet.map(ft=>(ft.wx-M.x)*f),front=rel[0]>=rel[1]?0:1;
  const pl=clamp((A_REACH-rel[front])/RIG.S,0,RIG.beta-.2);
  M.phase=((pl-(front===1?.5:0))%1+1)%1;
  M.start={t:0,from:M.feet.map(ft=>({...ft}))};M.state='walk';M.stopReq=false;
}
function update(dt){
  M.t+=dt;const f=M.facing;
  const edgeDist=f>0?WORLD_W-60-M.x:M.x-60;
  if(M.state==='idle'){
    if(input&&input!==f) M.turn={t:0,dur:.34,from:f},M.state='turn';
    else if(input===f&&edgeDist>110) beginWalk();
  }
  if(M.state==='walk'){
    if(input!==f||edgeDist<95){M.stopReq=true;if(input===-f)M.turnQ=1}else{M.stopReq=false;M.turnQ=0}
    const tgt=M.stopReq?RIG.maxSpeed*.82:RIG.maxSpeed;M.speed+=clamp(tgt-M.speed,-560*dt,560*dt);
    const prev=M.phase;M.phase+=M.speed*dt/RIG.S;M.x+=f*M.speed*dt;
    if(M.start){M.start.t+=dt;if(M.start.t>.32)M.start=null}
    if(M.stopReq){const c0=Math.floor(prev*2),c1=Math.floor(M.phase*2);
      if(c1>c0){const over=M.phase-c1/2;M.phase=c1/2;M.x-=f*over*RIG.S;const lead=(c1%2===0)?0:1;
        setWalkFeet();const fr=M.feet[lead],rr=M.feet[1-lead];const xT=fr.wx-f*15,d=Math.abs(xT-M.x);
        M.settle={t:0,dur:clamp(2*d/Math.max(60,M.speed),.42,.7),x0:M.x,xT,lead,r0:rr.wx,rT:xT-f*15,hip0:hipWalk()};M.state='settle';M.speed=0}}

  }
  if(M.state==='settle'){const s=M.settle;s.t+=dt;const k=clamp(s.t/s.dur),e=1-(1-k)*(1-k);
    M.x=lerp(s.x0,s.xT,e);const rr=M.feet[1-s.lead],fr=M.feet[s.lead];fr.lift=0;fr.ang=0;fr.piv=0;
    const kr=clamp((k-.05)/.85),er=.5-.5*Math.cos(Math.PI*kr);rr.wx=lerp(s.r0,s.rT,er);rr.lift=9*Math.sin(Math.PI*kr);rr.ang=kr<.35?-.5*Math.sin(Math.PI*kr/.35):.15*Math.sin(Math.PI*kr);rr.piv=kr<.12?1:0;
    if(k>=1){M.state='idle';rr.lift=0;rr.ang=0;rr.piv=0;M.settle=null;if(M.turnQ){M.turnQ=0;M.turn={t:0,dur:.34,from:f};M.state='turn'}}}

  const v=M.state==='walk'?M.speed:(M.state==='settle'?60:0);
  const tgt=-v*.075+(M.state==='turn'?8:0);M.cloth.v+=((tgt-M.cloth.x)*38-M.cloth.v*7)*dt;M.cloth.x+=M.cloth.v*dt;

function hipWalk(){return 119+4.5*Math.cos(4*Math.PI*(M.phase-.31))}

  const feet=M.feet.map(ft=>({lx:(ft.wx-M.x)*f,lift:ft.lift,ang:ft.ang,piv:ft.piv}));
  const ank=feet.map(ankleOf);
  for(const a of ank){const dx=a.x-hip.x,L=RIG.thigh+RIG.shin-.5;if(Math.abs(dx)<L)hip.y=Math.min(hip.y,a.y+Math.sqrt(L*L-dx*dx))}

    return{s,e,w:wr,a2}});
  return{hip,legs,chest,head,arms,lean,cloth:M.cloth.x,hood:M.hood.x,x:M.x,facing:f,turnK:M.turn?M.turn.t/M.turn.dur:-1,turnFrom:M.turn?M.turn.from:f}
}

  const nb={x:(f1.nx+f2.nx)/2,y:(f1.ny+f2.ny)/2};
  return[{x:a.x+f1.nx*wa,y:a.y+f1.ny*wa},{x:b.x+nb.x*wb,y:b.y+nb.y*wb},{x:c.x+f2.nx*wc,y:c.y+f2.ny*wc},{x:c.x-f2.nx*wc,y:c.y-f2.ny*wc},{x:b.x-nb.x*wb,y:b.y-nb.y*wb},{x:a.x-f1.nx*wa,y:a.y-f1.ny*wa}]}
function legXAt(L,y){if(y>=L.knee.y){const t=clamp((L.hip.y-y)/Math.max(1,L.hip.y-L.knee.y));return lerp(L.hip.x,L.knee.x,t)}const t=clamp((L.knee.y-y)/Math.max(1,L.knee.y-L.ankle.y));return lerp(L.knee.x,L.ankle.x,t)}
function drawLeg(ctx,L,far,id){
  shape(ctx,limbPoly(L.hip,L.knee,L.ankle,8,6.2,4.8),far?COL.legFar:COL.leg,1.8,id);
  const boot=[{x:-5,y:16},{x:-7,y:4},{x:-7.5,y:-5},{x:-6,y:-9},{x:9,y:-9},{x:18,y:-8.5},{x:21.5,y:-6.5},{x:21,y:-3.5},{x:14,y:-1},{x:7.5,y:3},{x:5.5,y:16}].map(p=>{const r=rot(p,L.ang);return{x:L.ankle.x+r.x,y:L.ankle.y+r.y}});
  shape(ctx,boot,COL.boot,1.8,id+1);
}
function drawArm(ctx,A,far,id){
  shape(ctx,limbPoly(A.s,A.e,A.w,6.8,6.4,9.8),far?COL.robeFar:COL.robe,2,id);
  const h={x:A.w.x+Math.sin(A.a2)*5,y:A.w.y-Math.cos(A.a2)*5};
  shape(ctx,[{x:h.x-3.5,y:h.y+2},{x:h.x+3.5,y:h.y+2},{x:h.x+3,y:h.y-4},{x:h.x,y:h.y-6},{x:h.x-3,y:h.y-4}],far?'rgb(110,90,66)':COL.hand,1.4,id+1);
}
function drawMonk(ctx,P,sx){
  // contact shadow on the walkway
  ctx.save();ctx.translate(sx,GROUND+3);const sg=ctx.createRadialGradient(0,0,4,0,0,60);sg.addColorStop(0,ink(.38));sg.addColorStop(1,ink(0));ctx.fillStyle=sg;ctx.scale(1,.16);ctx.beginPath();ctx.arc(0,0,60,0,6.3);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(sx,GROUND);
  let scx=P.facing;if(P.turnK>=0){scx=P.turnFrom*Math.cos(Math.PI*P.turnK);if(Math.abs(scx)<.14)scx=.14*Math.sign(scx||1)}
  ctx.scale(scx,-1);
  const [near,far]=P.legs,[nA,fA]=P.arms,H=P.hip,C=P.chest,Hd=P.head;
  drawArm(ctx,fA,true,10);
  drawLeg(ctx,far,true,20);drawLeg(ctx,near,false,30);
  // robe
  const lean=P.lean,up={x:Math.sin(lean),y:Math.cos(lean)},fw={x:Math.cos(lean),y:-Math.sin(lean)};
  const at=(b,f,u)=>({x:b.x+fw.x*f+up.x*u,y:b.y+fw.y*f+up.y*u});
  const hemY=52+(H.y-124)*.5,kneeY=(near.knee.y+far.knee.y)/2;
  const lx=[legXAt(near,hemY),legXAt(far,hemY)],kx=[near.knee.x,far.knee.x];
  const fl=Math.sin(M.t*7.3)*1.2*M.walkW;
  const hemF=Math.max(H.x+14,Math.max(...lx)+10)+P.cloth*.25,hemB=Math.min(H.x-15,Math.min(...lx)-10)+P.cloth;
  const robe=[at(C,7,4),at(C,14,-14),at(H,14,24),{x:Math.max(...kx)+9,y:kneeY+4},{x:hemF,y:hemY+2},{x:lerp(hemF,hemB,.3),y:hemY-1+fl},{x:lerp(hemF,hemB,.5),y:hemY+2-fl},{x:lerp(hemF,hemB,.72),y:hemY-1+fl*.5},{x:hemB,y:hemY+4},{x:Math.min(...kx)-12+P.cloth*.5,y:kneeY+12},at(H,-15,14),at(C,-15,-6),at(C,-9,6)];
  shape(ctx,robe,COL.robe,2.2,40);
  // folds, belt, rope
  ctx.lineCap='round';ctx.strokeStyle='rgba(18,11,6,.55)';ctx.lineWidth=1.2;
  for(const L of [near,far]){const a=bj(at(H,3,12),70),b=bj({x:L.knee.x+2,y:L.knee.y-4},71);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)/2+3,(a.y+b.y)/2,b.x,b.y-6);ctx.stroke()}
  const w1=at(H,-14,20),w2=at(H,14,22);ctx.beginPath();ctx.moveTo(w1.x,w1.y);ctx.quadraticCurveTo((w1.x+w2.x)/2,w1.y-3,w2.x,w2.y);ctx.lineWidth=3;ctx.strokeStyle=COL.line;ctx.stroke();ctx.lineWidth=1.2;ctx.strokeStyle='rgba(160,130,95,.6)';ctx.stroke();
  const r0=at(H,10,20);ctx.beginPath();ctx.moveTo(r0.x,r0.y);ctx.quadraticCurveTo(r0.x+4+P.cloth*.2,r0.y-26,r0.x+2+P.cloth*.45,r0.y-50);ctx.lineWidth=2.2;ctx.strokeStyle=COL.line;ctx.stroke();
  // hood + cowl
  const hd=P.hood;
  const hood=[{x:Hd.x+2,y:Hd.y+19},{x:Hd.x+13,y:Hd.y+15},{x:Hd.x+19,y:Hd.y+6},{x:Hd.x+18,y:Hd.y-7},{x:Hd.x+12,y:Hd.y-17},at(C,12,-4),at(C,15,-18),at(C,-16,-8),{x:Hd.x-19,y:Hd.y-9},{x:Hd.x-21+hd*.5,y:Hd.y+5},{x:Hd.x-15+hd*.7,y:Hd.y+15},{x:Hd.x-8+hd*.4,y:Hd.y+19}];
  shape(ctx,hood,COL.robe,2.2,60);
  const face=[{x:Hd.x+6,y:Hd.y+9},{x:Hd.x+14,y:Hd.y+8},{x:Hd.x+17,y:Hd.y+1},{x:Hd.x+16,y:Hd.y-8},{x:Hd.x+11,y:Hd.y-15},{x:Hd.x+5,y:Hd.y-11},{x:Hd.x+2.5,y:Hd.y-1}];
  const fp=new Path2D();smoothTo(fp,face.map((p,i)=>bj(p,i+90)),true);ctx.fillStyle=COL.face;ctx.fill(fp);
  ctx.beginPath();ctx.moveTo(Hd.x+14.5,Hd.y-3);ctx.quadraticCurveTo(Hd.x+15.5,Hd.y-8,Hd.x+12,Hd.y-12);ctx.lineWidth=1.1;ctx.strokeStyle='rgba(150,124,92,.4)';ctx.stroke();
  ctx.beginPath();ctx.moveTo(Hd.x+5,Hd.y+11);ctx.quadraticCurveTo(Hd.x+13,Hd.y+12,Hd.x+18,Hd.y+3);ctx.lineWidth=1.3;ctx.strokeStyle='rgba(170,140,104,.45)';ctx.stroke();
  ctx.beginPath();const c1=at(C,-10,0),c2=at(C,9,-6);ctx.moveTo(c1.x,c1.y);ctx.quadraticCurveTo(c1.x+6,c1.y-10,c2.x,c2.y);ctx.lineWidth=1.2;ctx.strokeStyle='rgba(18,11,6,.6)';ctx.stroke();
  drawArm(ctx,nA,false,80);
  if(opts.rig){ctx.lineWidth=1.5;for(const L of P.legs){ctx.strokeStyle='#e04';ctx.beginPath();ctx.moveTo(L.hip.x,L.hip.y);ctx.lineTo(L.knee.x,L.knee.y);ctx.lineTo(L.ankle.x,L.ankle.y);ctx.stroke()}
    ctx.strokeStyle='#0a8';ctx.beginPath();ctx.moveTo(H.x,H.y);ctx.lineTo(C.x,C.y);ctx.lineTo(Hd.x,Hd.y);ctx.stroke();
    for(const A of P.arms){ctx.strokeStyle='#08e';ctx.beginPath();ctx.moveTo(A.s.x,A.s.y);ctx.lineTo(A.e.x,A.e.y);ctx.lineTo(A.w.x,A.w.y);ctx.stroke()}
    ctx.fillStyle='#ff0';for(const L of P.legs){ctx.beginPath();ctx.arc(L.ankle.x,L.ankle.y,3,0,6.3);ctx.fill()}}
  ctx.restore();
}

// ================================================================ camera
const cam={x:M.x-VW/2,v:0,look:0};
function updateCam(dt){
  const minX=-VW*.42,maxX=WORLD_W-VW*.58;
  if(opts.cam==='flip'){const idx=Math.floor(M.x/VW);cam.x=clamp(idx*VW,minX,maxX);cam.v=0;return}
  cam.look+=((M.state==='walk'?1:.55)*M.facing-cam.look)*Math.min(1,dt*1.4);
  const target=clamp(M.x-VW/2+cam.look*VW*.13,minX,maxX);
  const w=2.4,a=w*w*(target-cam.x)-2*w*cam.v;cam.v+=a*dt;cam.x+=cam.v*dt;
}

// ================================================================ render
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const opts={cam:'follow',seams:false,rig:false,boil:true,twos:false,slow:false};
let pose=null,poseTick=-1,dustIdx=0,dustOff=[0,0];
function render(now){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(paperBase,0,0,cv.width,cv.height);
  const camY=Math.sin(now/1000*.31)*2.2;
  for(const L of LAYERS){
    if(L.name==='fore')drawMonkLayer(now,camY);
    const {lx,i0,i1}=chunkRange(L,cam.x);const yOff=camY*L.f;
    ctx.globalAlpha=L.alpha||1;
    for(let i=i0;i<=i1;i++){if(!validChunk(L,i))continue;const c=getChunk(L,i);
      const x=Math.round((i*CW-lx)*RS),x2=Math.round(((i+1)*CW-lx)*RS);ctx.drawImage(c,x,Math.round((L.y0+yOff)*RS),x2-x,Math.round(L.h*RS))}
    ctx.globalAlpha=1;
    if(L.name==='far')band(560,800,[[0,0],[.55,.6],[1,.25]]);
    if(L.name==='mid')band(640,840,[[0,0],[.7,.42],[1,.1]]);
    if(L.name==='play')band(900,1080,[[0,0],[1,.3]]);
  }
  // paper grain + grunge
  ctx.globalCompositeOperation='multiply';ctx.drawImage(paperMul,0,0);ctx.globalCompositeOperation='source-over';
  if(Math.floor(now/120)!==dustIdx){dustIdx=Math.floor(now/120);dustOff=[Math.random()*100-50,Math.random()*100-50]}
  ctx.globalAlpha=.55;ctx.drawImage(dust[dustIdx%dust.length],dustOff[0],dustOff[1],cv.width,cv.height);ctx.globalAlpha=1;
  ctx.fillStyle=`rgba(40,26,14,${.02+.03*h01(dustIdx,5)})`;ctx.fillRect(0,0,cv.width,cv.height);
  if(opts.seams)drawSeams();
}
function band(y0,y1,stops){const g=ctx.createLinearGradient(0,y0*RS,0,y1*RS);for(const [o,a] of stops)g.addColorStop(o,paper(a));ctx.fillStyle=g;ctx.fillRect(0,y0*RS,cv.width,(y1-y0)*RS)}
function drawMonkLayer(now,camY){
  const tick=Math.floor(now/(1000/12));
  if(!opts.twos||tick!==poseTick||!pose){pose=computePose();pose.camX=cam.x;poseTick=tick}
  boilSeed=opts.boil?Math.floor(now/(1000/12))%4+SEED*7:SEED;
  ctx.setTransform(RS,0,0,RS,0,camY*RS);
  drawMonk(ctx,pose,pose.x-(opts.twos?cam.x:cam.x));
  ctx.setTransform(1,0,0,1,0,0);
}
function drawSeams(){
  ctx.font=`${Math.round(13*RS)}px Georgia`;ctx.lineWidth=Math.max(1,RS*1.5);
  LAYERS.forEach((L,li)=>{const {lx,i0,i1}=chunkRange(L,cam.x);ctx.strokeStyle=L.col;ctx.fillStyle=L.col;ctx.setLineDash([8*RS,6*RS]);
    for(let i=i0;i<=i1+1;i++){const x=Math.round((i*CW-lx)*RS);ctx.beginPath();ctx.moveTo(x,L.y0*RS+li*4);ctx.lineTo(x,(L.y0+L.h)*RS);ctx.stroke();
      if(i<=i1&&validChunk(L,i)){const tx=`${L.name} #${i}  ×${L.f}`,ty=(40+li*22)*RS;ctx.fillStyle='rgba(20,13,7,.8)';ctx.fillRect(x+3*RS,ty-15*RS,ctx.measureText(tx).width+8*RS,20*RS);ctx.fillStyle=L.col;ctx.fillText(tx,x+7*RS,ty)}}});
  ctx.setLineDash([]);
}

// ================================================================ loop, prefetch, eviction
let last=0,fpsAcc=0,fpsN=0,fps=0;
function prefetch(){
  let budget=1;
  for(const L of LAYERS){const {i0,i1}=chunkRange(L,cam.x),dir=M.facing;
    const want=dir>0?[i1+1,i0-1,i1+2]:[i0-1,i1+1,i0-2];
    for(const i of want){if(budget<=0)return;if(!validChunk(L,i))continue;if(!cache.has(L.name+i)){getChunk(L,i);budget--}}}
}
function evict(){for(const [k,e] of cache){const L=LAYERS.find(l=>l.name===e.L);const {i0,i1}=chunkRange(L,cam.x);if(e.i<i0-3||e.i>i1+3)cache.delete(k)}}
const statsEl=document.getElementById('stats');
function frame(now){
  let dt=Math.min(.05,(now-(last||now))/1000);last=now;fpsAcc+=dt;fpsN++;if(fpsAcc>.5){fps=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0}
  if(opts.slow)dt*=.25;
  update(dt);updateCam(dt);render(now);
  const t0=performance.now();prefetch();if(fpsN===1)evict();
  statsEl.textContent=`fps ${fps}   state ${M.state}\nmonk x ${M.x.toFixed(0)}   cam x ${cam.x.toFixed(0)}\nmodules cached ${cache.size}   built ${stats.built}`;
  requestAnimationFrame(frame);
}

// ================================================================ sizing / input / ui
const coarse=matchMedia('(pointer:coarse)');let rotated=false;
function resize(){
  const W=innerWidth,H=innerHeight;
  rotated=coarse.matches&&H>W*1.05;                    // phone held upright: turn the frame sideways
  document.body.classList.toggle('rot',rotated);
  document.documentElement.style.setProperty('--w',W+'px');document.documentElement.style.setProperty('--h',H+'px');
  const aw=rotated?H:W,ah=rotated?W:H,ar=clamp(aw/ah,AR_MIN,AR_MAX);
  VW=Math.round(VH*ar);
  let cw=aw,ch=aw/ar;if(ch>ah){ch=ah;cw=ah*ar}
  cv.style.width=Math.round(cw)+'px';cv.style.height=Math.round(ch)+'px';
  const dpr=Math.min(devicePixelRatio||1,2),cap=coarse.matches?820:1080;
  const ph=Math.min(cap,Math.round(ch*dpr)),pw=Math.round(ph*ar);
  if(pw!==cv.width||ph!==cv.height){const oldRS=RS;cv.width=pw;cv.height=ph;RS=ph/VH;if(Math.abs(RS-oldRS)>1e-6)cache.clear();makePaper()}
}
let rto;const onResize=()=>{clearTimeout(rto);rto=setTimeout(resize,150)};
addEventListener('resize',onResize);addEventListener('orientationchange',onResize);if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
// panel collapse
const panel=document.getElementById('panel'),tog=document.getElementById('benchToggle');
function setCollapsed(c){panel.classList.toggle('collapsed',c);tog.setAttribute('aria-expanded',String(!c));try{localStorage.setItem('monk.bench.collapsed',c?'1':'0')}catch(e){}}
let saved=null;try{saved=localStorage.getItem('monk.bench.collapsed')}catch(e){}
setCollapsed(saved!==null?saved==='1':(coarse.matches||Math.min(innerWidth,innerHeight)<500));
tog.onclick=()=>{setCollapsed(!panel.classList.contains('collapsed'));cv.focus()};
// fullscreen + landscape lock (Android / desktop; iOS falls back to the rotated frame)
const de=document.documentElement,fsOK=document.fullscreenEnabled||document.webkitFullscreenEnabled;
if(fsOK)document.body.classList.add('can-fs');
if(coarse.matches)document.getElementById('focus').textContent='Hold the left or right side of the scene to walk';
async function goLandscape(){
  try{if(!(document.fullscreenElement||document.webkitFullscreenElement)){await (de.requestFullscreen?de.requestFullscreen({navigationUI:'hide'}):de.webkitRequestFullscreen())}}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch(e){}
  onResize();
}
document.getElementById('fs').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else goLandscape();};
document.addEventListener('fullscreenchange',()=>{document.getElementById('fs').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';onResize()});
const keys=new Set();
function syncInput(){const l=keys.has('l'),r=keys.has('r');input=l&&!r?-1:r&&!l?1:0}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.add('l');else if(k==='arrowright'||k==='d')keys.add('r');else if(k==='h')setCollapsed(!panel.classList.contains('collapsed'));else return;e.preventDefault();syncInput();hint()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.delete('l');if(k==='arrowright'||k==='d')keys.delete('r');syncInput()});
addEventListener('blur',()=>{keys.clear();syncInput()});
const ptr=new Map();
function ptrSync(){keys.delete('pl');keys.delete('pr');let l=0,r=0;for(const s of ptr.values()){if(s<0)l=1;else r=1}
  const kb={l:keys.has('l'),r:keys.has('r')};input=(kb.l||l)&&!(kb.r||r)?-1:(kb.r||r)&&!(kb.l||l)?1:0}
// in the rotated frame, the game's left→right runs top→bottom on the glass
function gameFrac(e){const rc=cv.getBoundingClientRect();return rotated?(e.clientY-rc.top)/rc.height:(e.clientX-rc.left)/rc.width}
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();hint();ptr.set(e.pointerId,gameFrac(e)<.5?-1:1);try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrSync()});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const d=gameFrac(e)<.5?-1:1;if(d!==ptr.get(e.pointerId)){ptr.set(e.pointerId,d);ptrSync()}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const up=e=>{ptr.delete(e.pointerId);ptrSync()};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function hint(){document.getElementById('focus').style.opacity=0}
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{opts.cam=b.dataset.cam;document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('on',x===b));cv.focus()});
document.querySelectorAll('[data-tint]').forEach(b=>b.onclick=()=>{cv.classList.toggle('graphite',b.dataset.tint==='graphite');document.querySelectorAll('[data-tint]').forEach(x=>x.classList.toggle('on',x===b));cv.focus()});
for(const id of ['seams','rig','boil','twos','slow']){const el=document.getElementById(id);el.onchange=()=>{opts[id]=el.checked;cv.focus()}}
document.getElementById('reseed').onclick=()=>{SEED=(SEED*48271+11)%2147483647;cache.clear();memo.clear();stats.built=0;cv.focus()};

// ================================================================ boot: build the opening view before the curtain lifts
async function boot(){
  resize();cam.x=M.x-VW/2;const ld=document.getElementById('loading');const jobs=[];
  for(const L of LAYERS){const {i0,i1}=chunkRange(L,cam.x);for(let i=i0;i<=i1;i++)if(validChunk(L,i))jobs.push([L,i])}
  for(let j=0;j<jobs.length;j++){ld.textContent=`Sharpening pencils… ${Math.round(j/jobs.length*100)}%`;await new Promise(r=>setTimeout(r,0));getChunk(jobs[j][0],jobs[j][1])}
  ld.classList.add('done');cv.focus();requestAnimationFrame(frame);
}
window.__monk={M,cam,opts,LAYERS,cache,stats,setInput:v=>{input=v}};
boot();
}
</script>
